please-payment:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 200m
        memory: 250Mi
      requests:
        cpu: 100m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'dev'

      - name: ENV_RUN
        value: 'Development'

      - name: NODE_ENV
        value: 'Development'

      - name: NEXT_PUBLIC_API_URL
        value: 'https://api-dev.please-payment.com'

      - name: BACKEND_URL
        value: 'http://please-payment-dev-onix-api'

      - name: ADMIN_DOCS_URL
        value: 'https://admin-dev.please-payment.com'

      - name: NEXT_PUBLIC_PROVIDER_URL
        value: 'https://web-dev.dev-hubs.com'

      # Contact Us form — Cloudflare Turnstile + SMTP (item 5, x080).
      # Site key is public by design, safe as a plain value; secret key and
      # SMTP creds come from please-payment-web-secrets (see
      # templates/please-payment-web/please-payment-web-external-secret.yaml).
      # This is a DEV-only Turnstile widget (domain: localhost) — swap for the
      # client's own production widget's keys before go-live.
      - name: TURNSTILE_SITE_KEY
        value: '0x4AAAAAAFKvgcfwhyOrzesI'

      - name: SMTP_HOST
        value: 'smtp-relay.gmail.com'

      - name: SMTP_PORT
        value: '587'

      - name: CONTACT_TO_EMAIL
        value: 'contact@dev-hubs.com'

      - name: TURNSTILE_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: please-payment-web-secrets
            key: TURNSTILE_SECRET_KEY

      - name: SMTP_USER
        valueFrom:
          secretKeyRef:
            name: please-payment-web-secrets
            key: SMTP_USER

      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: please-payment-web-secrets
            key: SMTP_PASSWORD
